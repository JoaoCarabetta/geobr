[project]
name = "geobr-mcp"
version = "0.1.0"
description = "MCP server for querying Brazilian spatial data via geobr and DuckDB"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "IPEA geobr team" },
]
dependencies = [
    "mcp>=1.2.0",
    "geobr[duckdb]>=0.3.0",
]

[project.scripts]
geobr-mcp = "geobr_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["geobr_mcp"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.uv.sources]
geobr = { path = "../python-package", editable = true }

[tool.pytest.ini_options]
markers = [
    "network: tests that download geobr data from the internet",
]
asyncio_mode = "auto"
testpaths = ["tests"]
