on:
  push:
    paths:
      - mcp-server/**
      - python-package/**
      - .github/workflows/mcp-CMD-check.yaml
    branches:
      - main
      - master
      - dev
  pull_request:
    paths:
      - mcp-server/**
      - python-package/**
      - .github/workflows/mcp-CMD-check.yaml
    branches:
      - main
      - master
      - dev

name: mcp-CMD-check

jobs:
  mcp-CMD-check:
    runs-on: ubuntu-latest
    name: ubuntu-latest (3.11)

    steps:
      - name: Check out geobr
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install geobr with DuckDB extra
        shell: bash
        working-directory: python-package
        run: |
          uv sync
          uv pip install -e ".[duckdb]"

      - name: Install and test geobr-mcp
        shell: bash
        working-directory: mcp-server
        run: |
          uv sync
          uv pip install -e "../python-package[duckdb]" -e .
          uv run pytest -m "not network" -v
